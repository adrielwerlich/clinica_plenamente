name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CI: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Versão do jogo Treino Cognitivo (TAG, ASSET, SHA256): lida antes do build para a página do jogo
      # usar a tag na URL do iframe (?v=) e o navegador buscar a versão nova sem esperar o cache.
      - name: Read Treino Cognitivo release pin
        run: |
          set -euo pipefail
          grep -E '^(TAG|ASSET|SHA256)=' .github/treino-cognitivo-release | sed -e 's/[[:space:]]*$//' -e 's/^/TC_/' >> "$GITHUB_ENV"

      - name: Build app
        env:
          REACT_APP_TREINO_COGNITIVO_VERSION: ${{ env.TC_TAG }}
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ secrets.REACT_APP_CLOUDINARY_CLOUD_NAME }}
        run: npm run build

      # Jogo Treino Cognitivo (build WebGL do Unity, ~64 MB): não fica no git; vem de um GitHub Release
      # deste repositório, conferido pelo SHA-256 fixado em .github/treino-cognitivo-release.
      - name: Add Treino Cognitivo game from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Treino Cognitivo: $TC_TAG / $TC_ASSET"
          mkdir -p "$RUNNER_TEMP/tc" build/games/treino-cognitivo
          gh release download "$TC_TAG" --repo "${{ github.repository }}" --pattern "$TC_ASSET" --dir "$RUNNER_TEMP/tc"
          echo "$TC_SHA256  $RUNNER_TEMP/tc/$TC_ASSET" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/tc/$TC_ASSET" -d build/games/treino-cognitivo
          test -f build/games/treino-cognitivo/index.html
          ls -la build/games/treino-cognitivo/Build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
